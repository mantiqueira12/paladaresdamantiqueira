# Deploy contínuo no Netlify a partir do GitHub.
# A cada push na branch principal, o Netlify roda o build (cliente -> SSR ->
# prerender) e publica o conteúdo de dist/. Não precisa mais de zip manual.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Fixa a versão do Node no build (mesma família do desenvolvimento).
  NODE_VERSION = "20"

# Cache (doc 13 §2.6): JS/CSS têm hash no nome → imutáveis por 1 ano.
# Fontes são estáveis; imagens podem ser trocadas → 7 dias.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
