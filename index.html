<!doctype html>

    <!-- Endereço oficial do site (canonical) -->

    <!-- Favicon / ícones (fundo creme, igual ao cabeçalho).
         O ?v=2 força os navegadores a baixar a versão nova, ignorando o ícone
         antigo (fundo preto) que ficou em cache. Tamanhos múltiplos de 48px =
         recomendação do Google para mostrar o favicon na busca. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- Open Graph / WhatsApp / Social Media -->

    <meta property="og:site_name" content="Paladares da Mantiqueira" />

    <meta name="twitter:image" content="https://paladaresdamantiqueira.com.br/og-image.jpg" />

    <!--SEO_CATALOG_JSONLD-->

    <!-- Fonts: self-host (public/fonts/, @font-face em src/index.css) — sem CSS
         render-blocking do Google Fonts. Preload só das 2 faces acima da dobra. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-700.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin>

    <!-- LCP: poster do hero servido local e com prioridade alta -->
    <link rel="preload" as="image" href="/hero-poster.webp" imagesrcset="/hero-poster-720.webp 720w, /hero-poster.webp 1440w" imagesizes="100vw" fetchpriority="high">

    <!-- Google Analytics 4: desativado em desenvolvimento local; a URL enviada
         conserva a rota e descarta query/hash potencialmente livres. -->
    <script>
      (() => {
        const location = window.location;
        if (['localhost', '127.0.0.1', '::1'].includes(location.hostname)) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-42VSMJHHFD';
        document.head.append(script);
        window.gtag('js', new Date());
        window.gtag('config', 'G-42VSMJHHFD', { page_location: location.origin + location.pathname });
      })();
    </script>
